services:
  mongodb:
    image: mongo:7
    container_name: wuyan-mongo
    restart: unless-stopped
    # MongoDB 仅容器内通信，不暴露外网端口
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: wuyan
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme_strong_password}
    entrypoint:
      - bash
      - -c
      - |
        if [ ! -f /data/db/keyfile ]; then
          openssl rand -base64 756 > /data/db/keyfile
          chmod 400 /data/db/keyfile
        fi
        exec docker-entrypoint.sh mongod --auth --replSet rs0 --keyFile /data/db/keyfile --bind_ip_all
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            const s = rs.status();
            if (s.ok === 1) { quit(0) } else { quit(1) }
          } catch(e) {
            if (e.codeName === 'NotYetInitialized') {
              rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]});
            }
            quit(1)
          }
        " --username wuyan --password ${MONGO_PASSWORD:-changeme_strong_password} --authenticationDatabase admin
      # interval 不宜太短: 每次 mongosh 连接会让 mongo 记 5-7 行 INFO 日志(Connection accepted/metadata/auth/ended),
      # 5s 间隔会把 docker compose logs -f 刷爆。30s 足够检测单节点副本集故障, start_period+retries 已覆盖启动期
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 10s

  mongo-init:
    image: mongo:7
    container_name: wuyan-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint:
      - mongosh
      - mongodb://wuyan:${MONGO_PASSWORD:-changeme_strong_password}@mongodb:27017/admin?authSource=admin&replicaSet=rs0
      - --eval
      - "db.getSiblingDB('wuyan'); quit(0)"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: wuyan-api
    restart: unless-stopped
    ports:
      - "19091:3000"
    volumes:
      - /root/kpl-data-daily:/app/kpl-data-daily
      - api-data:/app/data
    env_file:
      - ./.env
    environment:
      - MONGO_URI=mongodb://wuyan:${MONGO_PASSWORD:-changeme_strong_password}@mongodb:27017/wuyan?authSource=admin&replicaSet=rs0
      - TZ=Asia/Shanghai
      - SYNC_API_KEY=${SYNC_API_KEY:-}
      # kpl-data-daily 本地路径 & Python AI 透传
      - KPL_DATA_DIR=/app/kpl-data-daily
      - OPENAI_API_KEY=${AI_API_KEY:-}
      - OPENAI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_MODEL=${AI_MODEL:-deepseek-chat}
      # kpl-data-daily Git 备份（可选，不配则跳过 push）
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-KPL Data Bot}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-bot@kplwuyan.site}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
  api-data:
