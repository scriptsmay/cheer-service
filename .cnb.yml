# cheer-service CNB 流水线配置
# main push: 仅构建测试，不部署
# web_trigger_release: 网页「发版部署」按钮触发（.cnb/web_trigger.yml），同步 package.json 版本号提交 main 后打 tag
# tag_push（构建镜像 + SSH 部署 NAS）: 已于 2026-10-26 退役移除（密钥文件同步退役）；发版链路由 GitHub 主仓 → Vercel 承接

main:
  push:
    - name: ci-and-test
      runner:
        cpus: 4
      docker:
        image: node:20
      services:
        - docker
      env:
        NODE_ENV: test
      stages:
        - &stage-install
          name: install
          script: |
            npm ci

        - &stage-test
          name: test
          script: |
            npm test

        # # 3. 构建 Docker 镜像
        # - name: build-image
        #   script: |
        #     echo "${CNB_TOKEN}" | docker login --username=${CNB_TOKEN_USER_NAME} --password-stdin ${CNB_DOCKER_REGISTRY}
        #     IMAGE_TAG="${CNB_DOCKER_REGISTRY}/scriptsmay/cheer-service:${CNB_COMMIT_SHORT}"
        #     docker build -t ${IMAGE_TAG} -f server/Dockerfile .
        #     docker push ${IMAGE_TAG}
        #     docker manifest inspect ${IMAGE_TAG} >/dev/null \
        #       || { echo "镜像推送后无法在制品库检索到: ${IMAGE_TAG}"; exit 1; }
        #     echo "镜像已就绪: ${IMAGE_TAG}"
        #   exports:
        #     IMAGE_TAG: CNB_IMAGE_TAG

  # 网页「发版部署」按钮（.cnb/web_trigger.yml）：
  # 单测门禁（anchor 复用上方 install/test stage）→ 版本号远端实查（手填或留空 patch+1，查重失败即报错）
  # → npm version 同步 package.json/lock 并提交推 main → 打 annotated tag 指向该提交推 CNB
  # （tag_push 部署已退役，tag 仅作版本标记，不再触发构建部署）
  # 本事件只用内置 CNB_TOKEN（可信事件，repo-code:rw），不 import 密钥仓库，无需 allow_events 授权。
  web_trigger_release:
    - name: release-tag
      runner:
        cpus: 4
      docker:
        image: node:20
      env:
        NODE_ENV: test
      stages:
        - *stage-install
        - *stage-test
        - name: tag-and-push
          script: |
            set -e
            REPO_URL="https://cnb:${CNB_TOKEN}@cnb.cool/scriptsmay/cheer-service.git"

            # 版本号以远端实查为准（剥离 ^{} peel 行），不信任本地
            RAW_TAGS="$(git ls-remote --tags "${REPO_URL}" 'v*')"
            REMOTE_TAGS="$(printf '%s\n' "${RAW_TAGS}" | awk -F'/' '{print $NF}' | grep -v '\^{}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
            echo "远端现有 v* tag: $(printf '%s' "${REMOTE_TAGS}" | tr '\n' ' ')"

            if [ -n "${VERSION}" ]; then
              # 手填：校验格式
              printf '%s\n' "${VERSION}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                || { echo "手填版本号格式不合法: '${VERSION}'（应为 vX.Y.Z）"; exit 1; }
              NEW_TAG="${VERSION}"
            else
              # 留空：取远端最新 v* tag patch+1
              LATEST="$(printf '%s\n' "${REMOTE_TAGS}" | sort -V | tail -n 1)"
              if [ -z "${LATEST}" ]; then
                NEW_TAG="v0.0.1"
              else
                MAJOR="$(printf '%s' "${LATEST}" | cut -d. -f1 | tr -d 'v')"
                MINOR="$(printf '%s' "${LATEST}" | cut -d. -f2)"
                PATCH="$(printf '%s' "${LATEST}" | cut -d. -f3)"
                NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
                echo "自动发版: 远端最新 ${LATEST} → ${NEW_TAG}"
              fi
            fi

            # 查重：同名 tag 已存在直接失败，不静默跳过
            if printf '%s\n' "${REMOTE_TAGS}" | grep -Fxq "${NEW_TAG}"; then
              echo "tag 已存在于远端，拒绝重复发版: ${NEW_TAG}"; exit 1
            fi

            git config user.name "cnb-web-trigger"
            git config user.email "cnb-web-trigger@cnb.cool"

            # 同步 package.json / package-lock.json 版本号到新 tag（否则源码版本号与发版漂移）
            OLD_VER="$(node -p 'require("./package.json").version')"
            if [ "${OLD_VER}" != "${NEW_TAG#v}" ]; then
              npm version "${NEW_TAG#v}" --no-git-tag-version
              git add package.json
              if [ -f package-lock.json ]; then git add package-lock.json; fi
              git commit -m "chore: release ${NEW_TAG}"
              echo "package.json 版本号已同步: ${OLD_VER} → ${NEW_TAG#v}"
              # 先推 main（版本号提交），tag 再指向该提交——保证部署镜像内版本号一致
              git push "${REPO_URL}" "HEAD:main"
            else
              echo "package.json 已是 ${NEW_TAG#v}，跳过版本号同步提交"
            fi

            git tag -a "${NEW_TAG}" -m "release ${NEW_TAG} (web trigger)"
            git push "${REPO_URL}" "refs/tags/${NEW_TAG}"
            echo "已推送 tag ${NEW_TAG}；tag_push 部署已退役，不会自动构建部署"

# tag_push 构建部署流水线已于 2026-10-26 退役移除：生产发版与部署由 GitHub 主仓 → Vercel 承接，
# 原「构建镜像 + SSH 部署 NAS」整段配置（含其 CNB 密钥仓引用，密钥文件已退役）随之删除。
# 如将来确需恢复 CNB 侧部署，从 git 历史取回配置，并在 scriptsmay/project-secrets
# 新建对应密钥文件（密钥仓清单见该仓 README）。
