# cheer-service CNB 流水线配置
# main push: 仅构建测试，不部署
# web_trigger_release: 网页「发版部署」按钮触发（.cnb/web_trigger.yml），同步 package.json 版本号提交 main 后打 tag，自动走 tag_push 部署
# tag_push: 构建测试 + 部署（正式发布，顺序执行）

main:
  push:
    - name: ci-and-test
      runner:
        cpus: 4
      docker:
        image: node:20
      services:
        - docker
      env:
        NODE_ENV: test
      imports:
        - https://cnb.cool/scriptsmay/deploy-secrets/-/blob/main/cheer-service.yml
      stages:
        - &stage-install
          name: install
          script: |
            npm ci

        - &stage-test
          name: test
          script: |
            npm test

        # # 3. 构建 Docker 镜像
        # - name: build-image
        #   script: |
        #     echo "${CNB_TOKEN}" | docker login --username=${CNB_TOKEN_USER_NAME} --password-stdin ${CNB_DOCKER_REGISTRY}
        #     IMAGE_TAG="${CNB_DOCKER_REGISTRY}/scriptsmay/cheer-service:${CNB_COMMIT_SHORT}"
        #     docker build -t ${IMAGE_TAG} -f server/Dockerfile .
        #     docker push ${IMAGE_TAG}
        #     docker manifest inspect ${IMAGE_TAG} >/dev/null \
        #       || { echo "镜像推送后无法在制品库检索到: ${IMAGE_TAG}"; exit 1; }
        #     echo "镜像已就绪: ${IMAGE_TAG}"
        #   exports:
        #     IMAGE_TAG: CNB_IMAGE_TAG

  # 网页「发版部署」按钮（.cnb/web_trigger.yml）：
  # 单测门禁（anchor 复用上方 install/test stage）→ 版本号远端实查（手填或留空 patch+1，查重失败即报错）
  # → npm version 同步 package.json/lock 并提交推 main → 打 annotated tag 指向该提交推 CNB
  # → 自动触发下方 tag_push 构建部署。
  # 本事件只用内置 CNB_TOKEN（可信事件，repo-code:rw），不 import 密钥仓库，无需 allow_events 授权。
  web_trigger_release:
    - name: release-tag
      runner:
        cpus: 4
      docker:
        image: node:20
      env:
        NODE_ENV: test
      stages:
        - *stage-install
        - *stage-test
        - name: tag-and-push
          script: |
            set -e
            REPO_URL="https://cnb:${CNB_TOKEN}@cnb.cool/scriptsmay/cheer-service.git"

            # 版本号以远端实查为准（剥离 ^{} peel 行），不信任本地
            RAW_TAGS="$(git ls-remote --tags "${REPO_URL}" 'v*')"
            REMOTE_TAGS="$(printf '%s\n' "${RAW_TAGS}" | awk -F'/' '{print $NF}' | grep -v '\^{}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
            echo "远端现有 v* tag: $(printf '%s' "${REMOTE_TAGS}" | tr '\n' ' ')"

            if [ -n "${VERSION}" ]; then
              # 手填：校验格式
              printf '%s\n' "${VERSION}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                || { echo "手填版本号格式不合法: '${VERSION}'（应为 vX.Y.Z）"; exit 1; }
              NEW_TAG="${VERSION}"
            else
              # 留空：取远端最新 v* tag patch+1
              LATEST="$(printf '%s\n' "${REMOTE_TAGS}" | sort -V | tail -n 1)"
              if [ -z "${LATEST}" ]; then
                NEW_TAG="v0.0.1"
              else
                MAJOR="$(printf '%s' "${LATEST}" | cut -d. -f1 | tr -d 'v')"
                MINOR="$(printf '%s' "${LATEST}" | cut -d. -f2)"
                PATCH="$(printf '%s' "${LATEST}" | cut -d. -f3)"
                NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
                echo "自动发版: 远端最新 ${LATEST} → ${NEW_TAG}"
              fi
            fi

            # 查重：同名 tag 已存在直接失败，不静默跳过
            if printf '%s\n' "${REMOTE_TAGS}" | grep -Fxq "${NEW_TAG}"; then
              echo "tag 已存在于远端，拒绝重复发版: ${NEW_TAG}"; exit 1
            fi

            git config user.name "cnb-web-trigger"
            git config user.email "cnb-web-trigger@cnb.cool"

            # 同步 package.json / package-lock.json 版本号到新 tag（否则源码版本号与发版漂移）
            OLD_VER="$(node -p 'require("./package.json").version')"
            if [ "${OLD_VER}" != "${NEW_TAG#v}" ]; then
              npm version "${NEW_TAG#v}" --no-git-tag-version
              git add package.json
              if [ -f package-lock.json ]; then git add package-lock.json; fi
              git commit -m "chore: release ${NEW_TAG}"
              echo "package.json 版本号已同步: ${OLD_VER} → ${NEW_TAG#v}"
              # 先推 main（版本号提交），tag 再指向该提交——保证部署镜像内版本号一致
              git push "${REPO_URL}" "HEAD:main"
            else
              echo "package.json 已是 ${NEW_TAG#v}，跳过版本号同步提交"
            fi

            git tag -a "${NEW_TAG}" -m "release ${NEW_TAG} (web trigger)"
            git push "${REPO_URL}" "refs/tags/${NEW_TAG}"
            echo "已推送 tag ${NEW_TAG}，tag_push 流水线将自动构建并部署"

# 打标签时部署（正式发布）
$:
  tag_push:
    - name: build-and-deploy
      runner:
        cpus: 4
      docker:
        image: node:20
      services:
        - docker
      env:
        NODE_ENV: test
      imports:
        - https://cnb.cool/scriptsmay/deploy-secrets/-/blob/main/cheer-service.yml
      lock:
        key: cheer-service-deploy
        wait: true
        cancel-in-wait: true
      stages:
        # 1. 安装依赖
        - name: install
          script: |
            npm ci

        # 2. 运行测试
        - name: test
          script: |
            npm test

        # 3. 构建 Docker 镜像（tag_push 下使用版本 tag）
        - name: build-image
          script: |
            echo "${CNB_TOKEN}" | docker login --username=${CNB_TOKEN_USER_NAME} --password-stdin ${CNB_DOCKER_REGISTRY}
            IMAGE_TAG="${CNB_DOCKER_REGISTRY}/scriptsmay/cheer-service:${CNB_BRANCH}"
            docker build -t ${IMAGE_TAG} -f server/Dockerfile .
            docker push ${IMAGE_TAG}
            docker manifest inspect ${IMAGE_TAG} >/dev/null \
              || { echo "镜像推送后无法在制品库检索到: ${IMAGE_TAG}"; exit 1; }
            echo "镜像已就绪: ${IMAGE_TAG}"

        # 4. 部署到远程服务器
        - name: deploy
          image: alpine:latest
          script: |
            apk add --no-cache openssh-client
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s' "${DEPLOY_SSH_KEY_B64}" | base64 -d > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null || { echo "DEPLOY_SSH_KEY_B64 无法解码为可用私钥"; exit 1; }
            ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true

            printf '%s' "${REGISTRY_DEPLOY_TOKEN}" | ssh -o BatchMode=yes ${DEPLOY_USER}@${DEPLOY_HOST} -p ${DEPLOY_PORT} \
              "set -e; test -d ${DEPLOY_DIR} || { echo '远端部署目录不存在: ${DEPLOY_DIR}'; exit 1; }; test -w ${DEPLOY_DIR} || { echo '远端部署目录不可写: ${DEPLOY_DIR}'; exit 1; }; test -f ${DEPLOY_DIR}/.env || { echo '远端缺少 ${DEPLOY_DIR}/.env'; exit 1; }; echo 远端部署目录自检通过"

            COMPOSE_REMOTE_TMP="${DEPLOY_DIR}/docker-compose.yml.new"
            scp -q -P ${DEPLOY_PORT} -o BatchMode=yes docker-compose.yml \
              ${DEPLOY_USER}@${DEPLOY_HOST}:${COMPOSE_REMOTE_TMP}
            printf '%s' "${REGISTRY_DEPLOY_TOKEN}" | ssh -o BatchMode=yes ${DEPLOY_USER}@${DEPLOY_HOST} -p ${DEPLOY_PORT} "
              set -e
              cd ${DEPLOY_DIR}
              grep -q 'CHEER_SERVICE_IMAGE' docker-compose.yml.new || { echo '同步的 docker-compose.yml 不含 CHEER_SERVICE_IMAGE'; rm -f docker-compose.yml.new; exit 1; }
              docker compose -f docker-compose.yml.new config -q || { echo 'docker-compose.yml 语法校验失败'; rm -f docker-compose.yml.new; exit 1; }
              mv docker-compose.yml.new docker-compose.yml
              echo 'docker-compose.yml 已同步到远端'
            "

            # 部署
            REMOTE_PULL_IMAGE="${CNB_DOCKER_REGISTRY}/scriptsmay/cheer-service:${CNB_BRANCH}"
            echo "部署镜像: ${REMOTE_PULL_IMAGE}"
            printf '%s' "${REGISTRY_DEPLOY_TOKEN}" | ssh -o BatchMode=yes ${DEPLOY_USER}@${DEPLOY_HOST} -p ${DEPLOY_PORT} "
              cd ${DEPLOY_DIR} &&
              (docker inspect wuyan-api --format '{{.Config.Image}}' > .prev-image 2>/dev/null || true) &&
              docker login docker.cnb.cool -u cnb --password-stdin &&
              docker pull ${REMOTE_PULL_IMAGE} &&
              docker compose down api &&
              CHEER_SERVICE_IMAGE=${REMOTE_PULL_IMAGE} docker compose up -d api &&
              docker image prune -f
            "

        # 5. 部署后健康检查（坏镜像静默上线的闸门；不通过则触发 failStages 回滚）
        - name: health-check
          image: alpine:latest
          script: |
            apk add --no-cache openssh-client curl
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s' "${DEPLOY_SSH_KEY_B64}" | base64 -d > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null || { echo "DEPLOY_SSH_KEY_B64 无法解码为可用私钥"; exit 1; }
            ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true
            for i in $(seq 1 12); do
              if ssh -o BatchMode=yes ${DEPLOY_USER}@${DEPLOY_HOST} -p ${DEPLOY_PORT} \
                "curl -sf --max-time 5 http://localhost:19091/api/health | grep -q '\"status\":\"ok\"'"; then
                echo "健康检查通过（第 ${i} 次探测）：/api/health status=ok"
                exit 0
              fi
              echo "第 ${i} 次探测未通过，3 秒后重试..."
              sleep 3
            done
            echo "健康检查 12 次均未通过，判定部署失败，触发回滚"
            exit 1

      # 失败时回滚
      failStages:
        - name: rollback
          image: alpine:latest
          script: |
            apk add --no-cache openssh-client
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s' "${DEPLOY_SSH_KEY_B64}" | base64 -d > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null || { echo "DEPLOY_SSH_KEY_B64 无法解码为可用私钥，跳过回滚"; exit 1; }
            ssh-keyscan -H ${DEPLOY_HOST} >> ~/.ssh/known_hosts 2>/dev/null || true
            # 回滚到部署前记录的上一运行镜像（deploy 阶段写入 .prev-image），缺失时退回 :latest
            PREV_IMAGE="$(ssh -o BatchMode=yes ${DEPLOY_USER}@${DEPLOY_HOST} -p ${DEPLOY_PORT} "cat ${DEPLOY_DIR}/.prev-image 2>/dev/null")"
            [ -n "${PREV_IMAGE}" ] || PREV_IMAGE="${CNB_DOCKER_REGISTRY}/scriptsmay/cheer-service:latest"
            echo "回滚目标镜像: ${PREV_IMAGE}"
            ssh -o BatchMode=yes ${DEPLOY_USER}@${DEPLOY_HOST} -p ${DEPLOY_PORT} "cd ${DEPLOY_DIR} && docker compose down api && CHEER_SERVICE_IMAGE=${PREV_IMAGE} docker compose up -d api"
